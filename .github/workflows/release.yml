name: Release

# The filename matters. Every one of the seven npm packages has a trusted
# publisher on npmjs.com naming this workflow, so renaming this file breaks
# publishing until all seven are reconfigured.
#
# The seven are five platform packages, each carrying both binaries, plus one
# wrapper per frontend: @gyeonghokim/gerrit-mcp-server and
# @gyeonghokim/gerrit-cli.
#
# The MCP server is then listed on the MCP Registry under the GitHub
# namespace, which needs no setup beyond the id-token permission below.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # mint the OIDC token npm trusted publishing needs

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  release:
    name: Build and publish
    # Trusted publishing only works from cloud-hosted runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser needs the full history to build the changelog.
          fetch-depth: 0

      - uses: jdx/mise-action@v4

      - name: Require npm with trusted publishing support
        run: node scripts/require-npm-version.mjs 11.5.1

      - run: npm ci

      - name: Build binaries and publish the GitHub release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the npm packages
        run: node scripts/build-npm-packages.mjs "${GITHUB_REF_NAME}"

      # Before the first publish rather than after the fourth. Publishing is
      # not a transaction: a set that turns out to be incomplete or
      # inconsistent halfway through leaves some packages up at a version the
      # others never reach, and npm does not allow republishing over it.
      - name: Check the assembled packages
        run: node scripts/check-npm-packages.mjs "${GITHUB_REF_NAME}"

      # Also before the first publish. An upload that failed afterwards would
      # fail this job with the packages already up, skip the registry job, and
      # leave it nothing to re-run with.
      - name: Hand the stamped server.json to the registry job
        uses: actions/upload-artifact@v7
        with:
          name: server-json
          path: dist/server.json
          if-no-files-found: error

      # Platform packages go first: the wrapper pins them by exact version, so
      # publishing the wrapper first would leave a window where installing it
      # fails.
      #
      # There is deliberately no NPM_TOKEN or NODE_AUTH_TOKEN here. If npm
      # finds either, it uses the legacy token path and trusted publishing is
      # silently skipped.
      - name: Publish platform packages
        run: |
          for package in dist/npm/gerrit-mcp-server-*/; do
            echo "publishing ${package}"
            npm publish "${package}" --provenance --access public
          done

      # One per frontend, both pinning the platform packages published above.
      - name: Publish the wrapper packages
        run: |
          for package in dist/npm/gerrit-mcp-server dist/npm/gerrit-cli; do
            echo "publishing ${package}"
            npm publish "${package}" --provenance --access public
          done

  # A job of its own so that it can be re-run alone. The registry checks the
  # wrapper on npm, so this has to come after npm publish, and a failure here
  # must not mean re-running a job whose npm publishes would now be refused.
  mcp-registry:
    name: Publish to the MCP Registry
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mcp-publisher login github-oidc
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: server-json

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish server.json
