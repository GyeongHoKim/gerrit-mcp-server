# Release build matrix for gerrit-mcp-server.
#
# goreleaser produces the binaries and the GitHub Release. Publishing to npm is
# handled separately by scripts/build-npm-packages.mjs, which reads the
# artifact manifest goreleaser writes to dist/artifacts.json.
#
#   just build-all         cross-compile without releasing
#   just release-snapshot  full local dry run
version: 2

project_name: gerrit-mcp-server

before:
  hooks:
    - go mod tidy

builds:
  - id: gerrit-mcp-server
    main: ./cmd/gerrit-mcp-server
    binary: gerrit-mcp-server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/GyeongHoKim/gerrit-mcp-server/internal/version.Version={{ .Version }}
      - -X github.com/GyeongHoKim/gerrit-mcp-server/internal/version.Commit={{ .FullCommit }}
      - -X github.com/GyeongHoKim/gerrit-mcp-server/internal/version.Date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # No npm platform package maps to windows/arm64, so building it would
      # produce an artifact nobody can install.
      - goos: windows
        goarch: arm64

  # The command-line frontend. Same matrix, same stamps, and it lands in the
  # same archive and the same npm platform packages as the server.
  #
  # scripts/build-npm-packages.mjs matches artifacts on this id. Without it,
  # two builds per target would leave the manifest ambiguous and whichever
  # binary goreleaser listed first would be shipped as both.
  - id: gerrit-cli
    main: ./cmd/gerrit-cli
    binary: gerrit-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/GyeongHoKim/gerrit-mcp-server/internal/version.Version={{ .Version }}
      - -X github.com/GyeongHoKim/gerrit-mcp-server/internal/version.Commit={{ .FullCommit }}
      - -X github.com/GyeongHoKim/gerrit-mcp-server/internal/version.Date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      # Whoever downloads a tarball instead of installing from npm should get
      # the agent skill too; otherwise it is an npm-only feature by accident.
      - skills/**/*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs(\\(.*\\))?:"
      - "^test(\\(.*\\))?:"
      - "^chore(\\(.*\\))?:"
      - "^ci(\\(.*\\))?:"

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```jsonc
    { "mcpServers": { "gerrit": {
        "command": "npx",
        "args": ["-y", "@gyeonghokim/gerrit-mcp-server@{{ .Version }}"]
    }}}
    ```
